# Builds the single binary (dashboard embedded) for every platform and attaches
# the archives to a published release.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: make ui
      - name: Cross-compile
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; name=rlcd-gateway_${os}_${arch}
            bin=rlcd-gateway; [ "$os" = windows ] && bin=rlcd-gateway.exe
            mkdir -p dist/$name
            (cd gateway && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o ../dist/$name/$bin ./cmd/rlcd-gateway)
            cp LICENSE NOTICE dist/$name/
            if [ "$os" = windows ]; then (cd dist && zip -qr $name.zip $name)
            else tar -C dist -czf dist/$name.tar.gz $name; fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
