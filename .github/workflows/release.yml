# Builds the single binary (dashboard embedded) for every platform, attaches the
# archives to the release, and publishes the same binaries to npm and PyPI.
# Run it by hand (Actions > release > Run workflow) to redo an existing tag.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The packaging script comes from the workflow's own commit, so an older tag
      # rerun by hand is still packaged the current way.
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: tools/package   # cone mode keeps root files (LICENSE) too
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: make ui
      - name: Cross-compile
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; name=rlcd-gateway_${os}_${arch}
            bin=rlcd-gateway; [ "$os" = windows ] && bin=rlcd-gateway.exe
            mkdir -p dist/$name
            (cd gateway && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o ../dist/$name/$bin ./cmd/rlcd-gateway)
            cp LICENSE NOTICE dist/$name/
            if [ "$os" = windows ]; then (cd dist && zip -qr $name.zip $name)
            else tar -C dist -czf dist/$name.tar.gz $name; fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
      - name: Package for npm and PyPI
        run: python3 ci/tools/package/build.py dist "$TAG" packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Platform packages first, so the launcher's optionalDependencies resolve.
      # A version already on npm is skipped, so a rerun only publishes what is missing.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/npm
          for pkg in rlcd-gateway-* rlcd-gateway; do
            v=$(node -p "require('./$pkg/package.json').version")
            if npm view "$pkg@$v" version >/dev/null 2>&1; then echo "$pkg@$v already published"; continue; fi
            (cd "$pkg" && chmod +x bin/* && npm publish --access public --provenance)
          done

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi
          skip-existing: true
